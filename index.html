<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Orion for Reddit</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background-color: #ffffff;
      color: #000000;
      margin: 0;
      padding: 2rem;
      box-sizing: border-box;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      text-align: left;
    }

    .image {
      flex: 1 1 300px;
      text-align: center;
    }

    .image img {
      max-width: 100%;
      height: auto;
    }

    .text {
      flex: 2 1 400px;
    }

    h1 {
      font-size: 4rem;
      margin: 0.5em 0 0.2em;
    }

    h2 {
      font-size: 2rem;
      font-weight: normal;
      margin: 0.2em 0;
      color: #666666;
    }

    h3 {
      margin-top: 1.5em;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #121212;
        color: #ffffff;
      }

      h2 {
        color: #bbbbbb;
      }
    }

    @media (max-width: 1000px) {
      .container {
        flex-direction: column;
        text-align: center;
      }

      h1 {
        font-size: 10vw;
      }

      h2 {
        font-size: 6vw;
      }
    }
  </style>
  <!--meta name="theme-color" content="#990000"-->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Orion for Reddit">
  <meta property="og:title" content="Orion for Reddit">
  <meta property="og:image" content="https://orionforreddit.app/iphone.png">
  <meta name="description" content="Orion is a Reddit client for iOS built with love.">
  <meta name="og:description" property="og:description" content="Orion is a Reddit client for iOS built with love.">
</head>
<body>
  <div class="container">
    <div class="image">
      <img src="iphone.png" alt="Orion">
    </div>
    <div class="text">
      <h1>Orion</h1>
      <h2>A Reddit app for the discerning user<br />(people who like nice apps)</h2>
      <h3>Created by Ethan Chaffin</h3>
      <h4>Coming soon</h4>
    </div>
  </div>
</body>
</html>
